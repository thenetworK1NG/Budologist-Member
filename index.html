<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Budologist</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Budologist" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f1117; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none; min-height: 100vh; }
    input[type='date']::-webkit-calendar-picker-indicator { filter: invert(1); }
    .nav-tab { color: #64748b; transition: color 0.15s; }
    .nav-tab:hover { color: #cbd5e1; }
    .nav-tab.active { color: #4ade80; }
    .card-details { display: none; }
    .card-details.open { display: block; }
    .chevron { transition: transform 0.2s; }
    .chevron.flipped { transform: rotate(180deg); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.7s linear infinite; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="sticky top-0 z-20 border-b border-[#2d3748] flex items-center justify-between px-4 py-3" style="background:rgba(15,17,23,0.97);backdrop-filter:blur(12px)">
    <div class="flex items-center gap-3">
      <img src="icon.png" alt="Budologist" class="w-9 h-9 rounded-xl object-cover" />
      <span class="text-xl font-bold text-green-400 tracking-wide">Budologist</span>
    </div>
    <div id="install-btn-container"></div>
  </header>

  <!-- Main content area -->
  <main id="app-main" class="max-w-2xl mx-auto px-4 pt-6 pb-24">
    <div class="flex justify-center items-center py-20">
      <div class="w-8 h-8 rounded-full border-2 border-green-400 border-t-transparent spin"></div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 flex z-20 border-t border-[#2d3748]" style="background:#1a1f2e">
    <button data-route="analytics" class="nav-tab flex-1 flex flex-col items-center py-3 gap-1 text-xs">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Analytics</span>
    </button>
    <button data-route="members" class="nav-tab flex-1 flex flex-col items-center py-3 gap-1 text-xs">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Members</span>
    </button>
    <button data-route="add" class="nav-tab flex-1 flex flex-col items-center py-3 gap-1 text-xs">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      <span>Add Member</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
